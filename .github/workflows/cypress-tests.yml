name: CI - Cypress Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Start dev server
        run: npm start
        # Run in background to allow Cypress to start
        # Use ampersand (&) to run in background or use a tool like 'wait-on'
        # We'll run with 'nohup' to keep it running
        # Let's run it in background explicitly:
        # https://github.com/cypress-io/github-action/issues/278#issuecomment-680829622
        # Or better yet, use 'start-server-and-test' utility

        # Here's a better approach below (step replaced by 'start-server-and-test')

      - name: Run Cypress tests
        uses: cypress-io/github-action@v5
        with:
          start: npm start
          wait-on: 'http://localhost:3000'
          wait-on-timeout: 60
          browser: chrome
        env:
          CI: true

      - name: Upload Cypress Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots

      - name: Upload Cypress Videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos

      - name: Upload Cypress Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-reports
          path: cypress/reports
