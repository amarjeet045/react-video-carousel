      - name: Install dependencies
        run: npm ci

      - name: Run Cypress tests group2
        uses: cypress-io/github-action@v5
        with:
          start: npm start
          wait-on: 'http://localhost:3000'
          wait-on-timeout: 60
          browser: chrome
          spec: cypress/e2e/group2/*.cy.js
        env:
          CI: true

      - name: Upload Cypress Screenshots group2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots-group2
          path: cypress/screenshots

      - name: Upload Cypress Videos group2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos-group2
          path: cypress/videos

      - name: Upload Cypress Reports group2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-reports-group2
          path: cypress/reports
